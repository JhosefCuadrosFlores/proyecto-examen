spring.application.name=SistemaRestauranteBackend
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restauranteupeuu}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:comedor}
spring.datasource.password=${DB_PASSWORD:comedor123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ===================================================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL en Docker)
# ===================================================================
# 1. Levanta la BD: docker compose up -d   (desde la raiz del proyecto)
# 2. Variables opcionales: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# 3. Hibernate crea/actualiza tablas; DataInitializer carga usuarios y menus

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CONFIGURACION DE JWT (JSON Web Token)
# ===================================================================
# Clave secreta para firmar los tokens. Debe ser larga y segura en un entorno real!
sistema.menus.jwtSecret=ClaveSecretaParaSistemaDeMenusSuperSegura2024!

# Tiempo de expiracion del token en milisegundos (24 horas)
sistema.menus.jwtExpirationMs=86400000